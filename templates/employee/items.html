<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bar Inventory</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-4">
    <h1 class="mb-4">Bar Inventory</h1>

    <form action="{{ url_for('employee.add_item') }}" method="post" class="row g-2 mb-4">
      <div class="col-md-5">
        <input type="text" name="name" class="form-control" placeholder="Item name" required>
      </div>
      <div class="col-md-4">
        <select name="category_id" class="form-select">
          {% for category in categories %}
            <option value="{{ category.id }}">{{ category.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-3">
        <button type="submit" class="btn btn-primary w-100">Add item</button>
      </div>
    </form>

    {% for category in categories %}
      <div class="card mb-3">
        <div class="card-header fw-bold">{{ category.name }}</div>
        <ul class="list-group list-group-flush">
          {% for item in category.items %}
            <li class="list-group-item">{{ item.name }}</li>
          {% else %}
            <li class="list-group-item text-muted">No items yet</li>
          {% endfor %}
        </ul>
      </div>
    {% endfor %}
  </div>
</body>
</html>
