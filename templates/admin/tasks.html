{% extends "admin_base.html" %}
{% block title %}Closing Tasks{% endblock %}
{% block admin_content %}
  <p class="text-muted">The checklist employees tick off during every closing.</p>
  <div class="card mb-3">
    <ul class="list-group list-group-flush">
      {% for task in tasks %}
        <li class="list-group-item d-flex justify-content-between align-items-center">
          {{ task.description }}
          <form action="{{ url_for('admin.delete_task', task_id=task.id) }}" method="post"
                onsubmit="return confirm('Delete this task?');">
            <button type="submit" class="btn btn-outline-danger btn-sm">Delete</button>
          </form>
        </li>
      {% else %}
        <li class="list-group-item text-muted">No tasks yet</li>
      {% endfor %}
    </ul>
    <div class="card-body">
      <form action="{{ url_for('admin.add_task') }}" method="post" class="d-flex gap-2">
        <input type="text" name="description" class="form-control" placeholder="New closing task" required>
        <button type="submit" class="btn btn-sm btn-outline-primary">Add</button>
      </form>
    </div>
  </div>
{% endblock %}
