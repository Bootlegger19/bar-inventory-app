{% extends "admin_base.html" %}
{% block title %}Change PIN{% endblock %}
{% block admin_content %}
  <div style="max-width: 400px;">
    <h2 class="h4 mb-3">Change PIN</h2>
    {% if forced %}
      <div class="alert alert-info">You're using a temporary PIN. Choose a new one to continue.</div>
    {% endif %}
    <form method="post" autocomplete="off">
      <label class="form-label">Current PIN</label>
      <input type="password" name="current_pin" inputmode="numeric"
             class="form-control mb-3" required>

      <label class="form-label">New PIN ({{ min_len }} to {{ max_len }} digits)</label>
      <input type="password" name="new_pin" inputmode="numeric" maxlength="{{ max_len }}"
             autocomplete="new-password" class="form-control mb-3" required>

      <label class="form-label">Confirm new PIN</label>
      <input type="password" name="confirm_pin" inputmode="numeric" maxlength="{{ max_len }}"
             autocomplete="new-password" class="form-control mb-3" required>

      <button type="submit" class="btn btn-primary w-100">Update PIN</button>
    </form>
  </div>
{% endblock %}
