<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Admin Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h1>{{ bar.name }} — Admin</h1>
      <a href="{{ url_for('admin.logout') }}" class="btn btn-outline-secondary btn-sm">Log out</a>
    </div>

    <form action="{{ url_for('admin.add_category') }}" method="post" class="row g-2 mb-4">
      <div class="col-md-8">
        <input type="text" name="name" class="form-control" placeholder="New category name" required>
      </div>
      <div class="col-md-4">
        <button type="submit" class="btn btn-primary w-100">Add category</button>
      </div>
    </form>

    {% for category in categories %}
      <div class="card mb-3">
        <div class="card-header fw-bold">{{ category.name }}</div>
      </div>
    {% endfor %}
  </div>
</body>
</html>
